version: '2.1'
orbs:
  qodana: jetbrains/qodana@2026.1
environment:
  QODANA_ENDPOINT: "https://web.cloud.sssa-stgn.aws.intellij.net"
jobs:
  code-quality:
    machine:
      image: 'ubuntu-2004:current'
    steps:
      - checkout
      - qodana/scan
workflows:
  main:
    jobs:
      - code-quality:
          context: qodana
